name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: Ruff and import test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest numpy pillow aiohttp tqdm typing_extensions

      - name: Ruff
        run: ruff check .

      - name: Import and unit tests
        run: python -m pytest -q tests

      - name: Check gallery script syntax
        run: node --check js/Civitai_Gallery_Explorer.js
